function openBooking(code){closeDrawer();openRequest(code);}
function renderBooking(b,v){const state=bookingSession(b,v),over=overtimeMinutes(b),end=Math.min(1440,mins(b.end)+over),width=(end-mins(b.start))/1020*100,split=(mins(b.end)-mins(b.start))/(end-mins(b.start))*100;return `<button class="booking with-attached-buffer ${state.className} ${over?'has-overtime':''}" style="left:${(mins(b.start)-420)/1020*100}%;width:${width}%;--planned:${split}%" onclick="openBooking('${b.code}')" title="${b.code} · ${state.label}"><b>${b.start}–${b.end} WIB</b><span class="booking-code">${esc(b.code)}</span><small class="booking-person">${esc(b.booker)}</small><span class="booking-session">${state.label}${over?` · Lebih ${Math.floor(over/60)} jam ${Math.floor(over%60)} menit`:''}</span></button>${end<1440?`<div class="buffer-block attached-buffer" data-booking="${b.code}" title="Jeda 30 menit · ${fmt(end)}–${fmt(Math.min(end+30,1440))} WIB" style="left:${(end-420)/1020*100}%;width:${Math.min(30,1440-end)/1020*100}%;top:${state.className==='booking-impacted'?162:25}px">30 mnt</div>`:''}`;}
function scheduleGrid(vs,proposalMode=false){let date=proposalMode?(req().date||'2026-10-12'):fleetFilters.date;return `<div class="schedule" data-vehicles="${vs.map(v=>v.id).join(',')}" data-proposal="${proposalMode}"><div class="schedule-head"><span>Kendaraan & operasi</span><div>${Array.from({length:18},(_,i)=>`<span>${String((i+7)%24).padStart(2,'0')}:00</span>`).join('')}</div></div>${vs.map(v=>`<div class="schedule-row"><div class="vehicle-label"><button class="link" onclick="${proposalMode?`chooseProposalVehicle('${v.id}')`:`selectedVehicle='${v.id}';openDrawer('vehicle')`}">${vehicleName(v.id)}</button><p>${v.seats} penumpang</p>${badge(v.status)}<p>Kantor asal: ${tr(v.office)}</p><p>Lokasi saat ini: ${tr(v.location)}</p></div><div class="schedule-rail"><div class="row-time-markers" aria-hidden="true">${Array.from({length:18},(_,i)=>`<span>${String((i+7)%24).padStart(2,'0')}:00</span>`).join('')}</div>${vehicleBookings(v).filter(b=>b.date===date).map(b=>renderBooking(b,v)).join('')||'<span class="schedule-empty">Belum ada jadwal</span>'}</div></div>`).join('')}</div><p class="muted"><span class="legend-dot delayed-dot"></span> Terlambat kembali &nbsp; <span class="legend-dot active-dot"></span> Sedang digunakan &nbsp; <span class="legend-dot upcoming-dot"></span> Terjadwal &nbsp; <span class="legend-dot completed-dot"></span> Selesai &nbsp; ▧ Jeda wajib 30 menit</p>`;}
function foot(){return '';}

const canonicalFleet=[['GF-001','Toyota Innova',7,'In use','HQ','On Trip'],['GF-002','Toyota Avanza',7,'Available','HQ','HQ'],['GF-003','Honda Brio',4,'Maintenance','West Office','West Office'],['GF-004','Toyota Innova',7,'Available','HQ','HQ'],['GF-005','Toyota Avanza',7,'Delayed','West Office','On Trip'],['GF-006','Honda BR-V',7,'Available','East Office','East Office'],['GF-007','Honda Brio',4,'Available','HQ','HQ'],['GF-008','Toyota Hiace',12,'Delayed','HQ','On Trip'],['GF-009','Toyota Avanza',7,'Available','HQ','HQ'],['GF-010','Toyota Innova',7,'Available','East Office','East Office'],['GF-011','Honda BR-V',7,'Available','West Office','West Office'],['GF-012','Honda Brio',4,'Available','HQ','HQ']];
fleet.splice(0,fleet.length,...canonicalFleet.map(([id,model,seats,status,office,location])=>({id,model,seats,status,office,location,ready:status==='Available',readyAt:570,coordinated:true})));
Object.keys(employeeBookings).forEach(k=>delete employeeBookings[k]);
Object.assign(employeeBookings,{'GF-002':[['09:00','11:00','Andi Pratama'],['14:00','16:00','Maya Putri']],'GF-004':[['10:00','13:00','Rizky Saputra']]});
function manualErrors(){let v=fleet.find(v=>v.id===draft.vehicle);if(draft.durationOverflow)return ['Durasi target melewati akhir tanggal perjalanan. Pilih jam berangkat lebih awal atau ubah jam kembali secara manual.'];if(!v||!draft.start||!draft.end)return ['Pilih kendaraan dan isi waktu berangkat serta kembali.'];return constraints(v,req(),draft.start,draft.end,true);}
function validateManualInput(){let errors=manualErrors();let box=document.getElementById('manual-errors'),button=document.getElementById('review-manual');if(box)box.innerHTML=errors.length?`<div class="error">${errors.map(esc).join('<br>')}</div>`:'<p class="valid-input">✓ Jadwal valid · jeda minimal 30 menit terpenuhi.</p>';if(button)button.disabled=errors.length>0;return !errors.length;}
function chooseProposalVehicle(id){draft.vehicle=id;document.getElementById('proposal-vehicle').value=id;validateManualInput();document.getElementById('proposal-start').focus();}
function reviewManualProposal(){if(req().status!=='Pending'||!validateManualInput())return false;drawer='confirm';actionError='';renderDrawer();return true;}
const manualRenderDrawer=renderDrawer;
renderDrawer=function(){manualRenderDrawer();let element=document.querySelector('.drawer');if(element)element.classList.toggle('wide',drawer==='proposal');};

function proposalDiffCard(r){let html=tripCard(r).replace(/<div class="decision">[\s\S]*?<\/section>/,'</section>');html=html.replace(/<div><label>Berangkat → perkiraan kembali<\/label><b>[\s\S]*?<\/b><\/div>/,`<div class="diff-field"><label>Berangkat → perkiraan kembali</label><div class="change-values"><del>${r.start}–${r.end} WIB</del><span aria-hidden="true">→</span><ins>${draft.start}–${draft.end} WIB</ins></div></div>`);html=html.replace(/<div><label>Armada Dialokasikan[\s\S]*?<\/b><\/div>/,`<div class="diff-field"><label>Armada Dialokasikan → Usulan Armada</label><div class="change-values"><del>${vehicleName(['Approved','Completed'].includes(r.status)?r.vehicle:null)}</del><span aria-hidden="true">→</span><ins>${vehicleName(draft.vehicle)}</ins></div><small>Usulan armada · belum menjadi alokasi resmi</small></div>`);html=html.replace(/<div><label>(Usulan jam|Usulan Armada|Respons karyawan)<\/label><b>[\s\S]*?<\/b><\/div>/g,'');return html;}

function targetDuration(){return mins(req().end)-mins(req().start);}
function targetDurationLabel(){let d=targetDuration(),h=Math.floor(d/60),m=d%60;return [h?`${h} jam`:'',m?`${m} menit`:''].filter(Boolean).join(' ');}
function showDurationMode(){let el=document.getElementById('duration-mode');if(el)el.textContent=draft.endManual?'Jam kembali diubah manual':'Jam kembali otomatis mengikuti durasi target';}
function updateDeparture(value){draft.start=value;draft.durationOverflow=false;if(!draft.endManual){let end=value?mins(value)+targetDuration():NaN;draft.durationOverflow=Number.isFinite(end)&&end>=1440;draft.end=Number.isFinite(end)&&end<1440?fmt(end):'';let input=document.getElementById('proposal-end');if(input)input.value=draft.end;}showDurationMode();validateManualInput();}
function updateManualReturn(value){draft.end=value;draft.endManual=Boolean(value);draft.durationOverflow=false;showDurationMode();validateManualInput();}
function restoreTargetDuration(){draft.endManual=false;updateDeparture(draft.start||'');}

function materializeCalendarTickets(){for(const v of fleet)for(const b of vehicleBookings(v)){if(requests.some(r=>r.id===b.code))continue;const ticket={id:b.code,date:b.date,start:b.start,end:b.end,purpose:b.purpose,pax:Math.min(4,v.seats),origin:v.office,vehicle:v.id,status:b.sessionStatus==='completed'?'Completed':'Approved',sessionStatus:b.sessionStatus,overtimeEnd:b.overtimeEnd};requests.push(ticket);if(!seed.some(r=>r.id===ticket.id))seed.push(structuredClone(ticket));names[b.code]=b.booker;}}
materializeCalendarTickets();
render();
</script></body></html>
